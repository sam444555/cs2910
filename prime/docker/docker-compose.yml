networks:
  prime-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
    name: prime-net

services:
  prime1:
    image: replica-img
    container_name: prime1
    networks:
      prime-net:
        ipv4_address: 172.20.0.2
    command: python3 /root/cs2910/prime/docker/startup.py 1

  prime2:
    image: replica-img
    container_name: prime2
    networks:
      prime-net:
        ipv4_address: 172.20.0.3
    command: python3 /root/cs2910/prime/docker/startup.py 2

  prime3:
